<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E1B2C">
  <title>Football Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="#/" aria-label="Home">
        <span class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M2 16h28" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></span>
        <span id="siteName">Football Community</span>
      </a>
      <nav id="nav" aria-label="Main">
        <a href="#/" data-r="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a>
        <a href="#/leaderboard" data-r="leaderboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Leaderboard</span></a>
        <a href="#/matches" data-r="matches"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Matches</span></a>
        <a href="#/players" data-r="players"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.3 4.5 2.2 4.5 5.3"/></svg><span>Players</span></a>
        <a href="#/gallery" data-r="gallery"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span>Gallery</span></a>
        <a href="#/match/new" data-r="new" class="add-match"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Add match</span></a>
      </nav>
      <div id="authBox"></div>
    </div>
  </header>
  <div id="demoBanner" class="banner" hidden></div>
  <main id="app"><div class="wrap page"><p class="muted">Loading…</p></div></main>

  <footer class="foot"><div class="wrap"><span id="footInfo"></span><a href="#" id="footLogin">Admin</a></div></footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" id="modalCard"></div>
  </div>
  <div id="toast" class="toast" hidden role="status"></div>

  <script src="config.js"></script>
  <script src="stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
